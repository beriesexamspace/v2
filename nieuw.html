<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="apple-touch-icon" href="/v2/assets/icoon-180.png">
  <link rel="manifest" href="/v2/manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Berie's Exam Space">
  <meta property="og:title" content="Welkom | Berie's Exam Space">
  <meta property="og:description" content="Oefenvragen, theorie en examensimulaties voor psychologiestudenten aan de VUB.">
  <meta property="og:image" content="https://beriesexamspace.com/v2/assets/deel.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://beriesexamspace.com/v2/nieuw.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#FFFFFF">
  <script>
    (() => {
      let keuze;
      try { keuze = window.localStorage.getItem('bes_thema'); } catch {}
      const donker = keuze === 'donker' || (keuze !== 'licht' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = donker ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = donker ? '#0B0B0C' : '#FFFFFF';
    })();
  </script>
  <meta name="robots" content="noindex">
  <title>Welkom | Berie's Exam Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=24">
  <link rel="stylesheet" href="assets/highlights.css?v=24">
  <script src="assets/app.js?v=24"></script>
  <script src="assets/updates.js?v=24"></script>
  <script src="assets/highlights.js?v=24"></script>
  <script src="assets/config.js?v=24" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="assets/auth.js?v=24" defer></script>
  <script src="assets/activiteit.js?v=24" defer></script>
  <style>
    /* Alles in één scherm: kop, carrousel, balkjes en de knop Begrepen, zonder scrollen. */
    html, body { height: 100%; overflow: hidden; }
    .nieuw-pagina { display: flex; flex-direction: column; height: 100vh; height: 100dvh; padding: 36px 0 14px; overflow: hidden; }
    .nieuw-pagina .pagina-kop { margin-bottom: 12px; }
    .nieuw-pagina .pagina-kop .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .9375rem; }
    .nieuw-pagina .pagina-kop h1 { font-size: clamp(1.625rem, 3.2vw, 2.5rem); }
    .nieuw-pagina .pagina-kop p { margin-top: 10px; font-size: clamp(.9375rem, 1.2vw, 1.125rem); }
    .nieuw-pagina .hl { display: flex; flex: 1 1 auto; flex-direction: column; min-height: 0; }
    .nieuw-pagina .hl-baan { flex: 1 1 auto; min-height: 0; padding-top: 6px; padding-bottom: 14px; }
    .nieuw-pagina .hl-kaart { min-height: 0; }
    .nieuw-pagina .hl-bediening { flex: none; margin-top: 0; }
    .nieuw-verder { display: flex; flex: none; justify-content: center; margin-top: 12px; }
    .nieuw-begrepen:disabled,
    .nieuw-begrepen:disabled:hover,
    .nieuw-begrepen:disabled:active { opacity: .45; transform: none; box-shadow: var(--shadow-primary); cursor: default; }
    .site-footer { display: none; }
    @media (max-width: 767px) {
      .nieuw-pagina { padding-top: 24px; }
      .nieuw-pagina .pagina-kop { margin-bottom: 8px; padding-right: 56px; }
      .nieuw-pagina .hl-kaart { grid-template-rows: auto minmax(0, 1fr); }
      .nieuw-pagina .hl-tekst { padding: 20px 20px 12px; }
      .nieuw-pagina .hl-beeld { padding-top: 12px; }
      .nieuw-pagina .hl-updates { padding-bottom: 20px; }
    }
    /* Te weinig hoogte (bijvoorbeeld een telefoon in de breedte): dan mag de pagina gewoon scrollen. */
    @media (max-height: 560px) {
      html, body { height: auto; overflow: auto; }
      .nieuw-pagina { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
      .nieuw-pagina .hl-kaart { min-height: 380px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#inhoud">Ga naar inhoud</a>
  <main id="inhoud" class="pagina nieuw-pagina" aria-labelledby="nieuw-titel">
    <div class="wrap">
      <header class="pagina-kop">
        <p class="eyebrow">Welkom</p>
        <h1 id="nieuw-titel">De highlights op een rij.</h1>
        <p>Swipe zelf, of laat het even lopen. Daarna weet je hoe alles werkt.</p>
      </header>
    </div>

    <section class="hl" id="hl" aria-roledescription="carrousel" aria-label="Highlights van Berie's Exam Space"></section>

    <div class="wrap nieuw-verder">
      <button class="knop nieuw-begrepen" id="nieuw-begrepen" type="button" disabled aria-disabled="true">Begrepen →</button>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">Berie's Exam Space</p>
    <div class="footer-details">
      <p>Duidelijk leren. Rustig groeien.</p>
      <p class="project-label">A project of The Berie Foundation</p>
      <p class="footer-links"><a href="privacy.html">Privacy</a><span aria-hidden="true"> · </span><a href="mailto:berie007yldrm@gmail.com">berie007yldrm@gmail.com</a></p>
    </div>
  </footer>

  <script>
    (() => {
      const verder = document.getElementById('nieuw-begrepen');
      window.BES.highlights(document.getElementById('hl'), {
        metNieuw: true,
        kopniveau: 'h2',
        bijLaatste: () => {
          verder.disabled = false;
          verder.setAttribute('aria-disabled', 'false');
        }
      });

      verder.addEventListener('click', async () => {
        if (verder.disabled) return;
        verder.disabled = true;
        const versie = window.BES_VERSIE || 0;
        try {
          window.localStorage.setItem('bes_versie_gezien', String(versie));
          window.sessionStorage.setItem('bes_nav_intro', '1');
        } catch {}
        try {
          const auth = window.BES.auth;
          await Promise.race([auth.gereed, new Promise(resolve => window.setTimeout(resolve, 1500))]);
          if (await auth.gebruiker()) await auth.profielBijwerken({ versieGezien: versie });
        } catch {}
        window.location.assign('hub.html' + window.location.hash);
      });
    })();
  </script>
</body>
</html>
