<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <script>
    (() => {
      let keuze;
      try { keuze = window.localStorage.getItem('bes_thema'); } catch {}
      const donker = keuze === 'donker' || (keuze !== 'licht' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = donker ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = donker ? '#0B0B0C' : '#FFFFFF';
    })();
  </script>
  <meta name="robots" content="noindex">
  <title>Wat is nieuw | Berie's Exam Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=14">
  <script src="assets/app.js?v=14"></script>
  <script src="assets/updates.js?v=14"></script>
  <script src="assets/config.js?v=14" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script src="assets/auth.js?v=14" defer></script>
  <style>
    .nieuw-pagina { padding: clamp(40px, 7vh, 72px) 0 48px; }
    .nieuw-wrap { max-width: 640px; }
    .nieuw-pagina .pagina-kop .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: .9375rem;
    }
    .nieuw-updates { display: grid; gap: 24px; margin: 0; padding: 0; list-style: none; animation: updates-binnen 400ms var(--ease) both; }
    .nieuw-update { display: grid; grid-template-columns: 144px minmax(0, 1fr); gap: 20px; font-size: .9375rem; line-height: 1.6; }
    .nieuw-datum { color: var(--muted); }
    .nieuw-sentinel { height: 1px; margin-top: 32px; }
    .nieuw-begrepen { margin-top: 16px; transition: opacity 200ms var(--ease), transform 200ms var(--ease), box-shadow 200ms var(--ease); }
    .nieuw-begrepen:disabled,
    .nieuw-begrepen:disabled:hover,
    .nieuw-begrepen:disabled:active { opacity: .45; transform: none; box-shadow: var(--shadow-primary); cursor: default; }
    @keyframes updates-binnen {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 767px) {
      .nieuw-update { grid-template-columns: minmax(0, 1fr); gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .nieuw-updates { animation: none; }
      .nieuw-begrepen { transition: none; }
    }
  </style>
</head>
<body>
  <main class="pagina nieuw-pagina" aria-labelledby="nieuw-titel">
    <div class="wrap nieuw-wrap">
      <header class="pagina-kop">
        <p class="eyebrow">Nieuw</p>
        <h1 id="nieuw-titel">Dit is er veranderd.</h1>
        <p>Even doorlezen, dan weet je hoe alles werkt. Scrol naar beneden om verder te gaan.</p>
      </header>

      <ul class="nieuw-updates" id="nieuw-updates" aria-label="Laatste updates"></ul>

      <div class="nieuw-sentinel" id="nieuw-einde" aria-hidden="true"></div>
      <button class="knop nieuw-begrepen" id="nieuw-begrepen" type="button" disabled aria-disabled="true">Begrepen →</button>
    </div>
  </main>

  <footer class="site-footer">
    <p class="footer-brand">Berie's Exam Space</p>
    <div class="footer-details">
      <p>Duidelijk leren. Rustig groeien.</p>
      <p class="project-label">A project of The Berie Foundation</p>
    </div>
  </footer>

  <script>
    (() => {
      const updates = document.getElementById('nieuw-updates');
      for (const update of window.BES_UPDATES || []) {
        const item = document.createElement('li');
        item.className = 'nieuw-update';
        const datum = document.createElement('span');
        datum.className = 'nieuw-datum';
        datum.textContent = update.datum;
        const tekst = document.createElement('span');
        tekst.append(window.BES.updateTekst(update.tekst));
        item.append(datum, tekst);
        updates.append(item);
      }

      const sentinel = document.getElementById('nieuw-einde');
      const button = document.getElementById('nieuw-begrepen');
      let observer;

      const enable = () => {
        button.disabled = false;
        button.setAttribute('aria-disabled', 'false');
        observer?.disconnect();
        window.removeEventListener('scroll', checkVisible);
        window.removeEventListener('resize', checkVisible);
      };

      const checkVisible = () => {
        const bounds = sentinel.getBoundingClientRect();
        if (bounds.bottom > 0 && bounds.top < window.innerHeight) enable();
      };

      if ('IntersectionObserver' in window) {
        observer = new IntersectionObserver(entries => {
          if (entries.some(entry => entry.isIntersecting)) enable();
        }, { threshold: .01 });
        observer.observe(sentinel);
      } else {
        window.addEventListener('scroll', checkVisible, { passive: true });
        window.addEventListener('resize', checkVisible);
      }
      checkVisible();

      button.addEventListener('click', () => {
        if (button.disabled) return;
        try { window.sessionStorage.setItem('bes_nieuw_gezien', '1'); } catch {}
        window.location.assign('hub.html' + window.location.hash);
      });
    })();
  </script>
</body>
</html>
