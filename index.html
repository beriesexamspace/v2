<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Oefenvragen, theorie en examensimulaties voor psychologiestudenten aan de VUB.">
<meta name="theme-color" content="#FFFFFF">
<title>Berie's Exam Space</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230071e3'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Inter,Arial,sans-serif' font-size='34' font-weight='700' fill='%23fff'%3EB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Herr+Von+Muellerhoff&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFFFF;
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --grey-title:#8A8A8E;
    --accent:#0071e3;
    --accent-dark:#0062c4;
    --line:#E9E7F3;
    --sig:#B1B1B7;
    --pill:980px;
    --font:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--white);
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}

  /* Navigatiebalk */
  .nav{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    width:min(1400px,calc(100% - 32px));
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px 0 18px;
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:saturate(180%) blur(20px);
    backdrop-filter:saturate(180%) blur(20px);
    border:1px solid var(--line);
    border-radius:var(--pill);
    box-shadow:0 1px 2px rgba(29,29,31,.04),0 10px 30px rgba(29,29,31,.07);
    z-index:20;
    opacity:0;
    animation:nav-in .6s ease-out .1s forwards;
  }
  .brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:17px;color:var(--ink)}
  .mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--accent);color:#fff;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;flex:none;
  }
  .knop{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--accent);color:#fff;
    font-weight:600;font-size:15px;
    padding:11px 22px;border-radius:var(--pill);
    box-shadow:0 8px 22px rgba(0,113,227,.22);
    transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s cubic-bezier(.2,.8,.2,1),background .2s ease;
  }
  .knop:hover{transform:scale(1.03);background:var(--accent-dark);box-shadow:0 12px 28px rgba(0,113,227,.3)}

  /* Hero */
  .hero{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:120px 24px 48px;
    text-align:center;
  }
  .sig{
    position:absolute;
    left:50%;
    top:50%;
    width:min(90vw,1140px);
    height:auto;
    transform:translate(-50%,-58%);
    opacity:.52;
    pointer-events:none;
    z-index:0;
  }
  .sig text{
    font-family:'Herr Von Muellerhoff','Pinyon Script',cursive;
    font-size:230px;
    fill:var(--sig);
  }
  .sig .krul{fill:none;stroke:var(--sig);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .sig .masker{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
  .hero-in{
    position:relative;z-index:1;
    max-width:960px;
    opacity:0;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .05s forwards;
  }
  .kicker{color:var(--accent);font-weight:600;font-size:17px;margin-bottom:14px}
  h1{
    font-size:clamp(2.75rem,7.2vw,6.25rem);
    font-weight:700;
    line-height:1.02;
    text-wrap:balance;
  }
  h1 .r1{display:block;color:var(--ink)}
  h1 .r2{display:block;color:var(--grey-title)}
  .lead{
    color:var(--ink-soft);
    font-size:clamp(1.05rem,1.55vw,1.35rem);
    line-height:1.5;
    max-width:44rem;
    margin:24px auto 0;
  }
  .cta{
    margin-top:36px;
    opacity:0;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) .2s forwards;
  }
  .knop.groot{font-size:19px;padding:18px 34px}
  .account{display:inline-block;margin-top:18px;font-size:15.5px;color:var(--accent);font-weight:500}
  .account:hover{text-decoration:underline}

  /* Footer */
  footer{
    border-top:1px solid var(--line);
    padding:24px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    font-size:14px;
  }
  .foot-l{font-weight:500;color:var(--ink)}
  .foot-r{text-align:right;line-height:1.55}
  .foot-r b{font-weight:500;color:var(--ink);display:block}
  .foot-r span{color:var(--ink-soft);font-size:13px}

  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes nav-in{to{opacity:1}}

  @media (max-width:768px){
    .nav{top:12px;height:58px;padding:0 14px 0 12px}
    .brand{font-size:15px}
    .knop{padding:10px 18px;font-size:14px}
    .hero{padding:96px 20px 32px}
    .sig{width:98vw;opacity:.42;transform:translate(-50%,-60%)}
    .knop.groot{width:100%;max-width:320px;justify-content:center}
    .lead{font-size:1.05rem}
    footer{flex-direction:column;align-items:flex-start;padding:20px 22px}
    .foot-r{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){
    .nav,.hero-in,.cta{animation:none;opacity:1}
    .knop{transition:none}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<header>
  <nav class="nav" aria-label="Hoofdnavigatie">
    <a class="brand" href="index.html"><span class="mark">B</span>Berie's Exam Space</a>
    <a class="knop" href="#">Inloggen →</a>
  </nav>
</header>

<main class="hero">
  <svg class="sig" viewBox="0 0 1200 460" aria-hidden="true" focusable="false">
    <defs>
      <mask id="sigmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="460">
        <path class="masker" id="mask1" d="M0 0"/>
        <path class="masker" id="mask2" d="M0 0"/>
      </mask>
    </defs>
    <text id="sigtext" x="600" y="250" text-anchor="middle" mask="url(#sigmask)">Beries Foundation</text>
    <path class="krul" id="krul" d="M96 352 C260 318 420 400 600 356 C760 318 900 330 1040 372 C1090 387 1110 410 1074 414 C1040 418 1000 384 1044 356 C1080 334 1134 340 1160 370"/>
  </svg>

  <div class="hero-in">
    <p class="kicker">Welkom bij Berie's Exam Space</p>
    <h1><span class="r1">Jouw leerstof.</span><span class="r2">Jouw eigen space.</span></h1>
    <p class="lead">Alles wat je nodig hebt om overzicht te krijgen, slimmer te leren en door te groeien.</p>
    <div class="cta">
      <a class="knop groot" href="welkom.html">Begin nu →</a>
      <br>
      <a class="account" href="#">Maak een account</a>
    </div>
  </div>
</main>

<footer>
  <div class="foot-l">Berie's Exam Space</div>
  <div class="foot-r"><b>Duidelijk leren. Rustig groeien.</b><span>A project of Berie Foundation</span></div>
</footer>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var svg = document.querySelector('.sig');
  var tekst = document.getElementById('sigtext');
  var m1 = document.getElementById('mask1');
  var m2 = document.getElementById('mask2');
  var krul = document.getElementById('krul');
  var VB_W = 1200, MAX_W = 1120;

  function klaarzetten(){
    // Tekst passend maken en de maskerstroken per woord op de gemeten tekst leggen.
    var fs = 230;
    tekst.style.fontSize = fs + 'px';
    var bb = tekst.getBBox();
    if (bb.width > MAX_W) { fs = Math.floor(fs * MAX_W / bb.width); tekst.style.fontSize = fs + 'px'; bb = tekst.getBBox(); }
    var n = tekst.getNumberOfChars();
    var spatie = tekst.textContent.indexOf(' ');
    var e0 = tekst.getExtentOfChar(0), e1 = tekst.getExtentOfChar(spatie - 1);
    var e2 = tekst.getExtentOfChar(spatie + 1), e3 = tekst.getExtentOfChar(n - 1);
    var cy = bb.y + bb.height * 0.5;
    var dikte = bb.height * 1.15;
    m1.setAttribute('d', 'M' + (e0.x - 20) + ' ' + cy + ' L' + (e1.x + e1.width + 24) + ' ' + cy);
    m2.setAttribute('d', 'M' + (e2.x - 24) + ' ' + cy + ' L' + (e3.x + e3.width + 30) + ' ' + cy);
    m1.style.strokeWidth = dikte; m2.style.strokeWidth = dikte;
    // De krul volgt de gemeten onderkant van de tekst.
    var onder = bb.y + bb.height * 0.78;
    var links = Math.max(60, bb.x - 30), rechts = Math.min(VB_W - 40, bb.x + bb.width + 40);
    var mid = (links + rechts) / 2;
    krul.setAttribute('d',
      'M' + links + ' ' + (onder + 26) +
      ' C' + (links + 160) + ' ' + (onder - 10) + ' ' + (mid - 80) + ' ' + (onder + 70) + ' ' + mid + ' ' + (onder + 30) +
      ' C' + (mid + 150) + ' ' + (onder - 8) + ' ' + (rechts - 140) + ' ' + (onder + 4) + ' ' + (rechts - 40) + ' ' + (onder + 50) +
      ' C' + (rechts + 4) + ' ' + (onder + 70) + ' ' + (rechts + 20) + ' ' + (onder + 96) + ' ' + (rechts - 24) + ' ' + (onder + 100) +
      ' C' + (rechts - 62) + ' ' + (onder + 104) + ' ' + (rechts - 90) + ' ' + (onder + 66) + ' ' + (rechts - 52) + ' ' + (onder + 40) +
      ' C' + (rechts - 20) + ' ' + (onder + 20) + ' ' + (rechts + 24) + ' ' + (onder + 24) + ' ' + (rechts + 36) + ' ' + (onder + 46)
    );
  }

  function stroken(){ return [m1, m2, krul]; }

  function begin(){
    klaarzetten();
    var paden = stroken();
    var lens = paden.map(function(p){ return p.getTotalLength(); });
    var total = lens.reduce(function(a,b){ return a+b; }, 0);
    paden.forEach(function(p,i){
      p.style.strokeDasharray = lens[i] + ' ' + lens[i];
      p.style.strokeDashoffset = reduce ? 0 : lens[i];
    });
    if (reduce) return;

    var SCHRIJF = 4000, STIL = 2000, WIS = 3000, LEEG = 1000, LIFT = 120;
    var anims = [];

    function schrijf(){
      anims.forEach(function(a){ a.cancel(); }); anims = [];
      var t = 0;
      paden.forEach(function(p,i){
        var d = SCHRIJF * lens[i] / total;
        anims.push(p.animate([{strokeDashoffset: lens[i]}, {strokeDashoffset: 0}],
          {duration: d, delay: t, easing: 'linear', fill: 'both'}));
        t += d + LIFT;
      });
      setTimeout(wis, t + STIL);
    }
    function wis(){
      var t = 0;
      for (var i = paden.length - 1; i >= 0; i--) {
        var d = WIS * lens[i] / total;
        anims.push(paden[i].animate([{strokeDashoffset: 0}, {strokeDashoffset: lens[i]}],
          {duration: d, delay: t, easing: 'linear', fill: 'both'}));
        t += d + LIFT;
      }
      setTimeout(schrijf, t + LEEG);
    }
    setTimeout(schrijf, 350);
  }

  // Eerst het lettertype laten laden, anders meet je de fallback.
  m1.style.strokeDashoffset = 1e6; m2.style.strokeDashoffset = 1e6; krul.style.strokeDashoffset = 1e6;
  m1.style.strokeDasharray = '1e6 1e6'; m2.style.strokeDasharray = '1e6 1e6'; krul.style.strokeDasharray = '1e6 1e6';
  if (document.fonts && document.fonts.load) {
    document.fonts.load('230px "Herr Von Muellerhoff"').then(begin, begin);
  } else { begin(); }
})();
</script>
</body>
</html>
