<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Berie's Exam Space</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--white:#FFFFFF;--ink:#1D1D1F;--muted:#6E6E73;--accent:#0071e3;--line:#E9E7F3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:var(--white);color:var(--ink);font-family:'Inter',-apple-system,system-ui,sans-serif;text-align:center;padding:24px}
  .mark{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px}
  h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;line-height:1.1}
  p{color:var(--muted);margin-top:12px;font-size:1.05rem}
</style>
</head>
<body>
<main>
  <div class="mark">B</div>
  <h1>Berie's Exam Space</h1>
  <p>Nieuwe versie in opbouw. De startpagina uit Codex vervangt dit bestand.</p>
</main>
</body>
</html>
